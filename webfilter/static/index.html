<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ImageProcessor in Go</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.3/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.0.3/index.css">

<style>
  :root{
    --go-blue:      #00acd7;
    --go-blue-dark: #004155;
    --ivory:        #fdfced;
    --canvas:       #eceae0;
    --canvas-line:  #dcd9cc;
    --ink:          #1e2a33;
    --ink-soft:     #5c6670;
    --control-bg:   #e3e1d6;
    --control-bg-hover: #d8d5c7;
    --control-border: #c6c3b4;
    --ok:  #4f7a52;
    --err: #a34a3f;
    --font-sans: 'Geist Sans', sans-serif;
    --font-mono: 'Geist Mono', monospace;
    --radius: 3px;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    font-family: var(--font-sans);
    color: var(--ink);
    background: var(--go-blue-dark);
  }

  .frame{
    width: 100%;
    max-width: 1280px;
    background: var(--go-blue);
    border-radius: 6px;
    padding: 3px;
  }

  .header{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 24px;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ivory);
  }

  .header b{ font-weight: 600; }
  .header span{ opacity: 0.6; }

  .panel{
    background: var(--ivory);
    border-radius: 4px;
    padding: 28px;
  }

  .canvas-wrap{
    position: relative;
    aspect-ratio: 16 / 9;
    background: var(--canvas);
    background-image:
      linear-gradient(var(--canvas-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--canvas-line) 1px, transparent 1px);
    background-size: 28px 28px;
    border: 1px solid var(--canvas-line);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .canvas-wrap img{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
  }

  .canvas-wrap.has-image img{ display: block; }
  .canvas-wrap.has-image .canvas-empty{ display: none; }

  .canvas-empty{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--ink-soft);
  }

  .canvas-empty svg{ width: 34px; height: 34px; opacity: 0.5; }
  .canvas-empty p{ margin: 0; font-family: var(--font-mono); font-size: 13px; }

  .status-row{
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .status-dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink-soft);
  }

  .status-row.busy .status-dot{ background: var(--go-blue-dark); animation: pulse 1s ease-in-out infinite; }
  .status-row.ok .status-dot{ background: var(--ok); }
  .status-row.err .status-dot{ background: var(--err); }

  @keyframes pulse{ 50%{ opacity: 0.3; } }

  .controls{
    margin-top: 22px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  .btn, select, .file-label{
    height: 38px;
    padding: 0 16px;
    display: inline-flex;
    align-items: center;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    background: var(--control-bg);
    border: 1px solid var(--control-border);
    border-radius: var(--radius);
    cursor: pointer;
  }

  .btn:hover, select:hover, .file-field:hover .file-label{ background: var(--control-bg-hover); }

  .file-field{ position: relative; }
  .file-field input{ position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .file-label{ max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-soft); }
  .file-label.has-file{ color: var(--ink); }

  select{ padding-right: 34px; appearance: none; }

  .select-field{ position: relative; display: inline-flex; }
  .select-field::after{
    content: '';
    position: absolute;
    right: 14px;
    top: 50%;
    width: 7px;
    height: 7px;
    border-right: 1.5px solid var(--ink-soft);
    border-bottom: 1.5px solid var(--ink-soft);
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }

  .btn-primary{
    background: var(--go-blue-dark);
    border-color: var(--go-blue-dark);
    color: var(--ivory);
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 0.03em;
    padding: 0 20px;
  }

  .btn-primary:hover{ background: #005f7a; }
  .btn-primary:disabled{ opacity: 0.5; cursor: not-allowed; }

  .btn:focus-visible, select:focus-visible{ outline: 2px solid var(--go-blue-dark); outline-offset: 2px; }

  @media (max-width: 560px){
    .panel{ padding: 18px; }
    .controls{ flex-wrap: wrap; }
    .btn-primary{ width: 100%; }
  }
</style>
</head>
<body>

  <div class="frame">
    <div class="header">
      <span><b>ImageProcessor</b> // go</span>
      <span>v1 · local</span>
    </div>

    <div class="panel">

      <div class="canvas-wrap" id="canvasWrap">
        <img id="preview" alt="Processed output">
        <div class="canvas-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
            <rect x="3" y="4" width="18" height="16" rx="1.5"/>
            <circle cx="8.5" cy="9.5" r="1.5"/>
            <path d="M21 16l-5.5-5.5a1 1 0 0 0-1.4 0L4 20"/>
          </svg>
          <p>No image loaded</p>
        </div>
      </div>

      <div class="status-row" id="statusRow">
        <span class="status-dot"></span>
        <span id="statusText">idle · awaiting upload</span>
      </div>

      <div class="controls">
        <div class="file-field">
          <input type="file" id="fileInput" accept="image/png, image/jpeg">
          <span class="file-label" id="fileLabel">Choose file</span>
        </div>

        <div class="select-field">
          <select id="filterSelect">
            <option value="negative">Negative</option>
            <option value="grayscale">Grayscale</option>
            <option value="histogrameq">Histogram Equalize</option>
            <option value="sobel">Sobel Edge Detection</option>
            <option value="sharp">Sharpen</option>
            <option value="blur">Blur</option>
          </select>
        </div>
        <button class="btn btn-primary" id="uploadBtn">Apply</button>
      </div>
    </div>
  </div>

<script>
const fileInput    = document.getElementById('fileInput');
const fileLabel     = document.getElementById('fileLabel');
const uploadBtn     = document.getElementById('uploadBtn');
const filterSelect  = document.getElementById('filterSelect');
const preview       = document.getElementById('preview');
const canvasWrap    = document.getElementById('canvasWrap');
const statusRow     = document.getElementById('statusRow');
const statusText    = document.getElementById('statusText');

let uploadedFile = null;

function setStatus(state, text){
  statusRow.className = 'status-row' + (state ? ' ' + state : '');
  statusText.textContent = text;
}

fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (f){
    fileLabel.textContent = f.name;
    fileLabel.classList.add('has-file');
  }
});

function process(){
  if (!uploadedFile) return;

  const formData = new FormData();
  formData.append('image', uploadedFile);
  const filterName = filterSelect.options[filterSelect.selectedIndex].text.toLowerCase();

  uploadBtn.disabled = true;
  setStatus('busy', `processing · ${filterName}`);

  fetch(`/filters/${filterSelect.value}`, { method: 'POST', body: formData })
    .then(res => {
      if (!res.ok) throw new Error('processing failed');
      const ms = res.headers.get('X-Process-Time-Ms');
      return res.blob().then(blob => ({ blob, ms }));
    })
    .then(({ blob, ms }) => {
      preview.src = URL.createObjectURL(blob);
      canvasWrap.classList.add('has-image');
      setStatus('ok', `done · ${filterName} applied${ms ? ` · ${ms}ms` : ''}`);
    })
    .catch(() => setStatus('err', 'error · processing failed'))
    .finally(() => { uploadBtn.disabled = false; });
}

uploadBtn.addEventListener('click', () => {
  if (!fileInput.files[0]) return setStatus('err', 'error · no file chosen');
  uploadedFile = fileInput.files[0];
  process();
});

filterSelect.addEventListener('change', () => uploadedFile && process());
</script>

</body>
</html>
